[package]
name = "resonate"
version = "0.1.0"
edition = "2024"
authors = ["Abhijit Sipahimalani"]
license = "MIT"
description = "Native Linux Bluetooth headphone daemon and CLI for AirPods and Bowers & Wilkins"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rmp-serde = "1.3"
rmpv = { version = "1.3", features = ["with-serde"] }
thiserror = "2.0"
tokio = { version = "1.43", features = ["full"] }
libc = "0.2"
zbus = "5.5"
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
futures-lite = "2.6"
slint = "1.19"

[build-dependencies]
slint-build = "1.19"

[[bin]]
name = "resonate"
path = "src/main.rs"

[[bin]]
name = "resonate-gui"
path = "src/gui_main.rs"

